services:
  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: sponsorship_hub
      MYSQL_USER: hub
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  spring-backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_HOST: mysql-db
      DB_USER: hub
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, 32 characters or more}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  react-frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      spring-backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
