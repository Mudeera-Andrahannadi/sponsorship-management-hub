spring.application.name=sponsorship-hub

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sponsorship_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

hub.jwt-secret=${JWT_SECRET}
hub.jwt-hours=8
hub.hold-days=7
hub.cool-days=183
hub.cors-origin=${CORS_ORIGIN:http://localhost:5173}
